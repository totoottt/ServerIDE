workflows:
  expo-ios-ad-hoc:
    name: Server IDE iOS Ad Hoc
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: 26.4.1
      node: 22.13.0
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: app.carambola5307.spinach7929
    scripts:
      - name: Validate Expo application source
        script: |
          test -f app.config.ts
          test -f package.json
          test -f pnpm-lock.yaml
          test -f assets/images/icon.png
          node -e "const p=require('./package.json'); if (!p.dependencies?.expo || !p.devDependencies?.['babel-preset-expo'] || !p.devDependencies?.['@babel/plugin-transform-react-jsx']) process.exit(1)"
      - name: Install JavaScript dependencies
        script: |
          npm install --global --force pnpm@9.12.0
          pnpm --version
          pnpm install --frozen-lockfile
      - name: Generate native iOS project
        script: npx expo prebuild --platform ios --non-interactive
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: Run TypeScript checks
        script: pnpm check
      - name: Run unit tests
        script: |
          pnpm test
          python3 -m py_compile agent/serveride_agent.py
      - name: Build signed IPA
        script: |
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME"
      - name: Package ESign Payload ZIP and source ZIP
        script: |
          set -euo pipefail
          IPA_PATH=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          PAYLOAD_DIR=$(mktemp -d)
          unzip -q "$IPA_PATH" -d "$PAYLOAD_DIR"
          test -d "$PAYLOAD_DIR/Payload"
          (cd "$PAYLOAD_DIR" && zip -qry "$CM_BUILD_DIR/build/ServerIDE-ESign-Payload.zip" Payload)
          git archive --format=zip --output="$CM_BUILD_DIR/build/ServerIDE-source.zip" HEAD
          unzip -t "$CM_BUILD_DIR/build/ServerIDE-ESign-Payload.zip" >/dev/null
          unzip -t "$CM_BUILD_DIR/build/ServerIDE-source.zip" >/dev/null
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ServerIDE-ESign-Payload.zip
      - build/ServerIDE-source.zip
      - build/ios/xcarchive/*.xcarchive
      - ios/**/*.app
      - /tmp/xcodebuild_logs/*.log
