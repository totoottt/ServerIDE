workflows:
  ios-esign-ipa:
    name: Server IDE — Esign IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install JavaScript dependencies
        script: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Validate application source
        script: |
          pnpm check
          pnpm lint
          pnpm test
      - name: Create the iOS JavaScript bundle
        script: |
          pnpm exec expo export --platform ios --output-dir build/ios-export --clear
      - name: Generate native iOS project
        script: |
          pnpm exec expo prebuild --platform ios --no-install --clean
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$workspace"
          cd ios
          pod install
      - name: Build unsigned IPA for Esign
        script: |
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          scheme="$(basename "$workspace" .xcworkspace)"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/ServerIDE.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          app_path="$(find "$CM_BUILD_DIR/build/ServerIDE.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          mkdir -p "$CM_BUILD_DIR/build/Payload"
          cp -R "$app_path" "$CM_BUILD_DIR/build/Payload/"
          cd "$CM_BUILD_DIR/build"
          zip -qry ServerIDE-Esign-unsigned.ipa Payload
      - name: Create source ZIP
        script: |
          cd "$CM_BUILD_DIR"
          zip -qry "$CM_BUILD_DIR/build/ServerIDE-source.zip" . \
            -x '.git/*' 'node_modules/*' 'ios/*' 'android/*' 'build/*' '.expo/*'
    artifacts:
      - build/*.ipa
      - build/*.zip
      - build/**/*.log
