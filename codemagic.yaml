workflows:
  expo-ios-ad-hoc:
    name: Server IDE iOS Ad Hoc
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: 26.4.1
      node: 22.13.0
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: app.carambola5307.spinach7929
    scripts:
      - name: Validate Expo application source
        script: |
          test -f app.config.ts
          test -f package.json
          test -f pnpm-lock.yaml
          test -f assets/images/icon.png
          node -e "const p=require('./package.json'); if (!p.dependencies?.expo || !p.devDependencies?.['babel-preset-expo']) process.exit(1)"
      - name: Install JavaScript dependencies
        script: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Generate native iOS project
        script: npx expo prebuild --platform ios --non-interactive
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: Run TypeScript checks
        script: pnpm check
      - name: Run unit tests
        script: pnpm test
      - name: Build signed IPA
        script: |
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/*.xcarchive
      - ios/**/*.app
      - /tmp/xcodebuild_logs/*.log
