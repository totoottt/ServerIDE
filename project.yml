name: ServerIDE

options:
  bundleIdPrefix: app.carambola5307
  deploymentTarget:
    iOS: "17.0"

packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: 0.12.1

targets:
  ServerIDE:
    type: application
    platform: iOS
    sources:
      - path: ServerIDE
        excludes:
          - Resources
          - Info.plist
      - path: ServerIDE/Resources
        buildPhase: resources
        excludes:
          - __pycache__
    dependencies:
      - package: Citadel
        product: Citadel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.carambola5307.spinach7929
        PRODUCT_NAME: ServerIDE
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 12
        MARKETING_VERSION: 0.7.1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ServerIDE/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  ServerIDETests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ServerIDETests
    dependencies:
      - target: ServerIDE
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ServerIDE:
    build:
      targets:
        ServerIDE: all
        ServerIDETests: [test]
    test:
      targets:
        - ServerIDETests
